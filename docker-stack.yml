version: '3.8'

networks:
  aponti-net:
    driver: overlay
    attachable: true

volumes:
  db-data:

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=aponti_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  product-service:
    image: paulocarlosfilho/aponti-fap-product-service:v1.0.0
    environment:
      - PORT=3001
      - DB_HOST=db
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 3

  inventory-service:
    image: paulocarlosfilho/aponti-fap-inventory-service:v1.0.0
    environment:
      - PORT=3002
      - DB_HOST=db
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 3

  order-service:
    image: paulocarlosfilho/aponti-fap-order-service:v1.0.0
    environment:
      - PORT=3003
      - DB_HOST=db
      - PRODUCT_SERVICE_URL=http://product-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 3

  api-gateway:
    image: paulocarlosfilho/aponti-fap-api-gateway:v1.0.0
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PRODUCT_SERVICE_URL=http://product-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
    networks:
      - aponti-net
    deploy:
      mode: replicated
      replicas: 2